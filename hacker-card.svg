<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 450" width="100%" height="100%">
  <defs>
    <!-- Background Grid -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#00ffff" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>

    <!-- Neon Glow Filters -->
    <filter id="neon-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="neon-green" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Scanning Gradient -->
    <linearGradient id="scan-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(0, 255, 255, 0)" />
      <stop offset="50%" stop-color="rgba(0, 255, 255, 0.2)" />
      <stop offset="100%" stop-color="rgba(0, 255, 255, 0.8)" />
    </linearGradient>
  </defs>

  <style>
    /* Global Styles */
    .bg { fill: #07090f; }
    .text-mono { font-family: 'Courier New', Courier, monospace; }
    
    /* Colors */
    .cyan { fill: #00f0ff; }
    .cyan-dim { fill: #008f99; }
    .green { fill: #00ff41; }
    .white { fill: #ffffff; }
    .gray { fill: #8b949e; }
    .red { fill: #ff003c; }
    
    /* Animations */
    .scanline { 
      animation: scan 4s ease-in-out infinite alternate; 
      fill: url(#scan-grad);
    }
    .blink { animation: blinker 1s step-start infinite; }
    .spin-slow { animation: spin 8s linear infinite; transform-origin: 165px 235px; }
    .spin-reverse { animation: spin-rev 6s linear infinite; transform-origin: 165px 235px; }
    
    /* Keyframes */
    @keyframes scan {
      0% { transform: translateY(-50px); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translateY(450px); opacity: 0; }
    }
    @keyframes blinker { 50% { opacity: 0; } }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    @keyframes spin-rev { 100% { transform: rotate(-360deg); } }
  </style>

  <!-- 1. Background -->
  <rect width="850" height="450" class="bg" rx="12" />
  <rect width="850" height="450" fill="url(#grid)" rx="12" />

  <!-- 2. Window Container -->
  <rect x="15" y="15" width="820" height="420" fill="none" stroke="#00f0ff" stroke-width="1.5" rx="8" filter="url(#neon-cyan)" stroke-opacity="0.6" />
  
  <!-- Mac-Style Window Header -->
  <rect x="15" y="15" width="820" height="35" fill="#0c111a" rx="8" />
  <!-- Straighten the bottom corners of the header -->
  <rect x="15" y="35" width="820" height="15" fill="#0c111a" />
  
  <circle cx="35" cy="32" r="6" fill="#ff5f56" />
  <circle cx="55" cy="32" r="6" fill="#ffbd2e" />
  <circle cx="75" cy="32" r="6" fill="#27c93f" />
  <text x="425" y="37" class="text-mono cyan-dim" font-size="14" text-anchor="middle" letter-spacing="2">Developer IDENTIFICATION CARD.</text>

  <!-- 3. Left Panel: BIOMETRIC RADAR -->
  <rect x="30" y="65" width="270" height="350" fill="none" stroke="#008f99" stroke-width="1" rx="5" />
  <text x="45" y="90" class="text-mono cyan" font-size="12" letter-spacing="1">GLOBAL MAP_</text>
  
  <!-- Radar Circles & Crosshairs -->
  <g stroke="#00f0ff" stroke-opacity="0.3" fill="none">
    <circle cx="165" cy="235" r="100" />
    <circle cx="165" cy="235" r="75" stroke-dasharray="4 4" class="spin-reverse" />
    <circle cx="165" cy="235" r="50" class="spin-slow" stroke-dasharray="10 5" stroke-width="2"/>
    <circle cx="165" cy="235" r="25" />
    <line x1="65" y1="235" x2="265" y2="235" />
    <line x1="165" y1="135" x2="165" y2="335" />
  </g>
  
  <!-- "Target" indicator -->
  <circle cx="210" cy="190" r="4" fill="#ff003c" filter="url(#neon-cyan)" class="blink"/>
  
  <text x="45" y="395" class="text-mono cyan" font-size="12">AUTHENTICATION: <tspan class="white">Not Available..</tspan></text>

  <!-- 4. Right Panel: DATA & STATS -->
  <rect x="320" y="65" width="500" height="350" fill="none" stroke="#008f99" stroke-width="1" rx="5" />
  
  <g class="text-mono" transform="translate(340, 95)">
    <text y="0" font-size="12" class="gray">console</text>
    
    <!-- USERNAME -->
    <text y="35" font-size="28" font-weight="bold" class="white" filter="url(#neon-cyan)">Emmanouil Dragatakis</text>
    
    <!-- DETAILS -->
    <text y="70" font-size="14" class="cyan">SYSTEM ID: <tspan class="white">Computer Science Student</tspan></text>
    <text y="90" font-size="12" class="gray">(retained from &lt;NODE_01&gt;)</text>
    
    <text y="120" font-size="14" class="cyan">ROLE: <tspan class="white">Front-End Developer</tspan></text>
    <text y="140" font-size="12" class="gray">(clarified from &lt;UNIV_CSD_UOC_DB&gt;)</text> 

    <text y="170" font-size="14" class="cyan">Origin: <tspan class="white">Greece, GR</tspan></text>
    <text y="190" font-size="14" class="cyan">Status: <tspan class="green blink">Active</tspan></text>
    <text y="210" font-size="14" class="cyan">Sector: <tspan class="white">Web Development, UI/UX, Algorithms</tspan></text>
    
    <!-- SKILLS MATRIX -->
    <text y="250" font-size="14" class="cyan">▼ Core Languages</text>
    
    <!-- Using hex colors and symbols for a super-hacker look -->
    <text y="275" font-size="14">  <tspan class="white">JS/TS </tspan> <tspan class="green">[#########-]</tspan> <tspan class="cyan">90%</tspan></text>
    <text y="295" font-size="14">  <tspan class="white">React </tspan> <tspan class="green">[########--]</tspan> <tspan class="cyan">80%</tspan></text>
    <text y="315" font-size="14">  <tspan class="white">Web App Accessibilities  </tspan> <tspan class="green">[##########]</tspan> <tspan class="cyan">100%</tspan></text>
  </g>

  <!-- 5. Animated Scanline (Overlay) -->
  <rect x="15" y="15" width="820" height="80" class="scanline" style="pointer-events: none;" />

</svg>
